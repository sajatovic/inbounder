<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intellirush Inbounder — Support & User Guide</title>
    <style>
        :root {
            --primary: #0A84FF;
            --primary-gradient: linear-gradient(135deg, #0A84FF 0%, #0066CC 100%);
            --accent: #5E5CE6;
            --success: #30D158;
            --warning: #FF9F0A;
            --danger: #FF453A;
            --bg: #F5F7FA;
            --surface: #FFFFFF;
            --surface-secondary: #F0F2F5;
            --border: #E2E8F0;
            --text-primary: #1C1C1E;
            --text-secondary: #636366;
            --text-tertiary: #8E8E93;
            --card-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.02);
            --card-shadow-hover: 0 10px 25px -3px rgba(0, 0, 0, 0.08), 0 4px 10px -2px rgba(0, 0, 0, 0.03);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-full: 9999px;
            --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #2997FF;
                --primary-gradient: linear-gradient(135deg, #2997FF 0%, #0A84FF 100%);
                --accent: #7D7AFF;
                --success: #32D74B;
                --warning: #FFD60A;
                --danger: #FF453A;
                --bg: #0C0D0E;
                --surface: #18191B;
                --surface-secondary: #222427;
                --border: #2C2E33;
                --text-primary: #F5F5F7;
                --text-secondary: #A1A1A6;
                --text-tertiary: #6E6E73;
                --card-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
                --card-shadow-hover: 0 10px 25px -3px rgba(0, 0, 0, 0.6);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding-bottom: 60px;
        }

        /* Hero / Header */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 48px 24px 36px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 250px;
            background: radial-gradient(circle, rgba(10, 132, 255, 0.15) 0%, rgba(10, 132, 255, 0) 70%);
            pointer-events: none;
        }

        .header-container {
            max-width: 860px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            background: rgba(10, 132, 255, 0.1);
            color: var(--primary);
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            margin-bottom: 16px;
            border: 1px solid rgba(10, 132, 255, 0.2);
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--primary);
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            line-height: 1.15;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 1.15rem;
            color: var(--text-secondary);
            max-width: 640px;
            margin: 0 auto 24px;
            font-weight: 400;
        }

        .header-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .contact-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            background: var(--surface-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: var(--transition);
        }

        .contact-action:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }

        .contact-action.primary {
            background: var(--primary);
            color: #FFFFFF;
            border-color: transparent;
        }

        .contact-action.primary:hover {
            opacity: 0.92;
            color: #FFFFFF;
            transform: translateY(-1px);
        }

        /* Layout Container */
        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        /* Quick Search & Filter Navigation */
        .search-container {
            margin: 20px 0 28px;
            position: sticky;
            top: 16px;
            z-index: 100;
        }

        .search-input-wrapper {
            position: relative;
            background: var(--surface);
            border-radius: var(--radius-full);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
            transition: var(--transition);
        }

        .search-input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 8px 30px rgba(10, 132, 255, 0.18);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-tertiary);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 0.98rem;
            color: var(--text-primary);
            border-radius: var(--radius-full);
        }

        .search-input::placeholder {
            color: var(--text-tertiary);
        }

        /* Category Nav Chips */
        .nav-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 6px 2px 18px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .nav-chips::-webkit-scrollbar {
            display: none;
        }

        .nav-chip {
            padding: 8px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            white-space: nowrap;
            transition: var(--transition);
        }

        .nav-chip:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        /* Section Headings */
        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 40px 0 18px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border);
        }

        .section-icon {
            width: 34px;
            height: 34px;
            background: rgba(10, 132, 255, 0.1);
            color: var(--primary);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        h2 {
            font-size: 1.45rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        /* FAQ Accordion Item */
        .faq-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            margin-bottom: 14px;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            overflow: hidden;
        }

        .faq-item:hover {
            box-shadow: var(--card-shadow-hover);
            border-color: rgba(10, 132, 255, 0.3);
        }

        summary {
            padding: 18px 22px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
            list-style: none;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        summary::after {
            content: '›';
            font-size: 1.5rem;
            line-height: 1;
            color: var(--text-tertiary);
            transition: transform 0.2s ease;
        }

        details[open] summary::after {
            transform: rotate(90deg);
            color: var(--primary);
        }

        details[open] summary {
            border-bottom: 1px solid var(--border);
            background: var(--surface-secondary);
        }

        .answer {
            padding: 20px 22px;
            color: var(--text-secondary);
            font-size: 0.98rem;
            line-height: 1.7;
        }

        .answer p {
            margin-bottom: 12px;
        }

        .answer p:last-child {
            margin-bottom: 0;
        }

        .answer ul, .answer ol {
            padding-left: 24px;
            margin: 10px 0;
        }

        .answer li {
            margin-bottom: 8px;
        }

        .answer strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Info Callout Box */
        .callout {
            border-radius: var(--radius-md);
            padding: 14px 18px;
            margin: 14px 0;
            font-size: 0.92rem;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .callout.tip {
            background: rgba(48, 209, 88, 0.12);
            border: 1px solid rgba(48, 209, 88, 0.25);
            color: var(--text-primary);
        }

        .callout.info {
            background: rgba(10, 132, 255, 0.1);
            border: 1px solid rgba(10, 132, 255, 0.25);
            color: var(--text-primary);
        }

        .callout.warning {
            background: rgba(255, 159, 10, 0.12);
            border: 1px solid rgba(255, 159, 10, 0.25);
            color: var(--text-primary);
        }

        .callout-icon {
            font-size: 1.1rem;
            line-height: 1.4;
            flex-shrink: 0;
        }

        /* Feature Matrix Table */
        .table-responsive {
            overflow-x: auto;
            margin: 14px 0;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            text-align: left;
        }

        th {
            background: var(--surface-secondary);
            color: var(--text-primary);
            font-weight: 600;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .pill-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--surface-secondary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .pill-tag.pro {
            background: rgba(94, 92, 230, 0.15);
            color: var(--accent);
            border-color: rgba(94, 92, 230, 0.3);
        }

        /* Footer */
        footer {
            margin-top: 60px;
            text-align: center;
            padding: 30px 20px;
            border-top: 1px solid var(--border);
            color: var(--text-tertiary);
            font-size: 0.9rem;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
